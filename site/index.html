<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title">x-cmd/icon —— 架构图图标库</title>
<meta name="description" content="x-cmd 架构图图标库:云厂商官方标识 + 自绘概念图标 + 品牌标识,按 <cat>:<concept> 索引。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='3' y='3' width='8' height='8' rx='2' fill='%23f59e0b'/><rect x='13' y='3' width='8' height='8' rx='2' fill='%23fbbf24'/><rect x='8' y='13' width='8' height='8' rx='2' fill='%23a78bfa'/></svg>">
<base href="__ICON_BASE__/">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 顶栏:参考 x-cmd-hub/draw 的站 —— 品牌 + 导航靠左,动作靠右 -->
<header class="top">
  <div class="top-inner">
    <div class="nav-left">
      <a class="brand" href="./" data-nav>
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2" fill="#f59e0b"/><rect x="13" y="3" width="8" height="8" rx="2" fill="#fbbf24"/><rect x="8" y="13" width="8" height="8" rx="2" fill="#a78bfa"/></svg>
        <span class="brand-name">X-CMD</span><span class="slash" aria-hidden="true">/</span><span class="product">Icon</span>
      </a>
      <span class="site-title" data-i18n="heroTitle">架构图图标库</span>
      <nav class="nav-links" aria-label="Navigation">
        <a href="https://github.com/ljh-sh/iconbase" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </div>
    <div class="nav-actions">
      <button id="lang" type="button" class="lang-toggle" aria-label="切换语言">EN</button>
      <button id="theme" type="button" class="icon-btn" aria-label="切换深浅色">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="main">
  <!-- 一个过滤页 —— 大搜索框 + 分类筛选,一边打一边筛 -->
  <section id="home">
    <div class="hero">
      <div class="search big">
        <svg class="s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q2" type="search" autocomplete="off" spellcheck="false" data-i18n-ph="search" placeholder="搜索图标:id / 名称 / 分类">
        <button id="clear2" type="button" class="s-clear" hidden aria-label="清空搜索">×</button>
      </div>
    </div>
    <div id="filters" class="filters"></div>
    <div class="grid-head"><span id="all-count" class="count"></span></div>
    <div id="all" class="grid"></div>
    <div class="more-wrap"><button id="more" class="more" type="button" hidden></button></div>
  </section>

  <p id="empty" class="empty" hidden>没有匹配的图标。</p>
</main>

<!-- 点图标:右侧滑出一个面板 —— 图标信息 + 相关图标 -->
<div id="scrim" class="scrim" hidden></div>
<aside id="panel" class="panel" hidden aria-label="图标详情">
  <div class="panel-head">
    <div class="panel-head-text">
      <code id="p-id" class="p-id"></code>
      <p id="p-desc" class="p-desc"></p>
    </div>
    <button id="p-close" type="button" class="icon-btn" aria-label="关闭">×</button>
  </div>
  <div class="panel-body">
    <div class="panel-preview" id="p-preview"></div>
    <dl class="panel-meta">
      <dt data-i18n="lblCat">分类</dt><dd id="p-cat"></dd>
      <dt data-i18n="lblVer">版本</dt><dd id="p-version"></dd>
      <dt data-i18n="lblVerdict">结论</dt><dd><span id="p-verdict" class="verdict"></span></dd>
      <dt data-i18n="lblLicense">著作权</dt><dd id="p-license"></dd>
      <dt data-i18n="lblTrademark">商标权人</dt><dd id="p-trademark"></dd>
      <dt data-i18n="lblPolicy">商标政策</dt><dd id="p-policy"></dd>
      <dt data-i18n="lblRestrictions">使用限制</dt><dd id="p-restrictions"></dd>
      <dt data-i18n="lblReviewed">复核</dt><dd id="p-reviewed"></dd>
      <dt data-i18n="lblSource">出处</dt><dd id="p-source"></dd>
      <dt data-i18n="lblFile">文件</dt><dd><a id="p-file" href="#" download data-i18n="download">下载</a></dd>
    </dl>
    <details id="p-notes-wrap"><summary data-i18n="notes">许可分析</summary><div id="p-notes" class="notes"></div></details>
    <details id="p-src-wrap"><summary data-i18n="src">SVG 源码</summary><pre id="p-src"></pre></details>
    <section class="related">
      <h3 class="related-title" data-i18n="related">相关图标</h3>
      <div id="p-related" class="rel-grid"></div>
    </section>
  </div>
</aside>

<script src="app.js"></script>
</body>
</html>
